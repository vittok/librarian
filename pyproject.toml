[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookroom-local"
version = "1.0.0"
description = "A local Python ebook catalogue and batch conversion workshop"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
dev = ["pytest>=8"]

[project.scripts]
bookroom = "bookroom.server:main"

[tool.setuptools.package-data]
bookroom = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
